<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>NutriLog</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #080808; font-family: 'IBM Plex Sans Arabic', sans-serif; color: #eee; }
.app { min-height: 100vh; background: #080808; }
.topbar { background: #101010; border-bottom: 1px solid #1a1a1a; padding: 14px 20px;
  display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
.logo { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: #c8f55a; letter-spacing: 2px; }
.tabs { display: flex; gap: 4px; background: #1a1a1a; border-radius: 10px; padding: 4px; }
.tab { padding: 6px 14px; border-radius: 7px; font-size: 13px; cursor: pointer; border: none;
  background: transparent; color: #555; font-family: inherit; transition: all 0.15s; }
.tab.active { background: #c8f55a; color: #000; font-weight: 600; }
.content { padding: 16px; max-width: 600px; margin: 0 auto; }
.summary-bar { background: #111; border: 1px solid #1e1e1e; border-radius: 16px; padding: 20px; margin-bottom: 16px; }
.cal-display { display: flex; align-items: flex-end; gap: 6px; margin-bottom: 4px; }
.cal-big { font-family: 'Bebas Neue', sans-serif; font-size: 52px; color: #c8f55a; line-height: 1; }
.cal-sub { font-size: 12px; color: #555; padding-bottom: 8px; }
.remaining { font-size: 13px; color: #555; margin-bottom: 16px; }
.remaining strong { color: #c8f55a; }
.remaining strong.over { color: #ff6b6b; }
.macro-rings { display: flex; gap: 8px; justify-content: space-around; margin-top: 12px; flex-wrap: wrap; }
.ring-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.ring-label { font-size: 11px; color: #888; text-align: center; }
.ring-sub { font-size: 10px; color: #555; text-align: center; }
.add-card { background: #111; border: 1px solid #1e1e1e; border-radius: 16px; padding: 20px; margin-bottom: 16px; }
.add-title { font-size: 11px; letter-spacing: 2px; color: #444; text-transform: uppercase; margin-bottom: 14px; }
.meal-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.meal-tab { padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; border: 1px solid #222;
  background: #161616; color: #666; font-family: inherit; transition: all 0.15s; }
.meal-tab.active { background: #1e2d0a; border-color: #c8f55a; color: #c8f55a; }
.input-row { display: flex; gap: 8px; margin-bottom: 10px; }
.inp { flex: 1; background: #161616; border: 1px solid #222; border-radius: 10px; padding: 12px 14px;
  color: #eee; font-family: inherit; font-size: 14px; outline: none; }
.inp:focus { border-color: #c8f55a; }
.inp-sm { width: 80px; flex: none; }
.btn { background: #c8f55a; color: #000; border: none; border-radius: 10px; padding: 12px 16px;
  font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap; }
.btn:disabled { opacity: 0.4; }
.error { font-size: 12px; color: #ff6b6b; margin-top: 6px; }
.meal-section { background: #111; border: 1px solid #1e1e1e; border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
.meal-header { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1a1a1a; }
.meal-name { font-size: 13px; font-weight: 600; color: #aaa; }
.meal-cal { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: #c8f55a; }
.food-item { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #141414; }
.food-item:last-child { border-bottom: none; }
.food-name { font-size: 13px; color: #ddd; }
.food-grams { font-size: 11px; color: #555; margin-top: 2px; }
.food-macros { display: flex; gap: 6px; margin-top: 3px; flex-wrap: wrap; }
.food-macro-tag { font-size: 10px; color: #555; background: #1a1a1a; padding: 1px 6px; border-radius: 4px; }
.food-right { display: flex; align-items: center; gap: 6px; }
.food-cal-num { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: #888; }
.del-btn { background: none; border: none; color: #333; cursor: pointer; font-size: 16px; padding: 4px 6px; border-radius: 6px; }
.empty-meal { padding: 16px; text-align: center; font-size: 12px; color: #333; }
.section-title { font-size: 11px; letter-spacing: 2px; color: #444; text-transform: uppercase; margin: 20px 0 10px; }
.nutrients-box { background: #111; border: 1px solid #1e1e1e; border-radius: 14px; padding: 16px 20px; margin-bottom: 14px; }
.bar-row { margin-bottom: 12px; }
.bar-top { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 12px; }
.bar-label { color: #aaa; }
.bar-val { color: #666; font-size: 11px; }
.bar-val.over { color: #ff6b6b; }
.bar-track { height: 6px; background: #1e1e1e; border-radius: 99px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 99px; transition: width 0.4s ease; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #000;
  border-top-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.hidden { display: none; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo">NutriLog</div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('log')">📋 السجل</button>
      <button class="tab" onclick="switchTab('analysis')">📊 التحليل</button>
    </div>
  </div>

  <div class="content">
    <!-- Summary -->
    <div class="summary-bar">
      <div class="cal-display">
        <div class="cal-big" id="totalCal">0</div>
        <div class="cal-sub">كالوري مستهلك</div>
      </div>
      <div class="remaining" id="remainingText">متبقي <strong>2300</strong> كالوري من 2300</div>
      <div class="macro-rings" id="ringsContainer"></div>
    </div>

    <!-- Log Tab -->
    <div id="logTab">
      <div class="add-card">
        <div class="add-title">إضافة طعام</div>
        <div class="meal-tabs" id="mealTabs"></div>
        <div class="input-row">
          <input class="inp" id="foodInput" placeholder="اكتب اسم الطعام..." onkeydown="if(event.key==='Enter') addFood()" />
          <input class="inp inp-sm" id="gramsInput" type="number" placeholder="غ" value="100" min="1" max="2000" />
          <button class="btn" id="addBtn" onclick="addFood()">تحليل</button>
        </div>
        <div class="error hidden" id="errorMsg"></div>
      </div>
      <div id="mealSections"></div>
    </div>

    <!-- Analysis Tab -->
    <div id="analysisTab" class="hidden">
      <div class="section-title">الماكروز</div>
      <div class="nutrients-box" id="macrosBox"></div>
      <div class="section-title">المعادن</div>
      <div class="nutrients-box" id="mineralsBox"></div>
      <div class="section-title">الفيتامينات</div>
      <div class="nutrients-box" id="vitaminsBox"></div>
    </div>
  </div>
</div>

<script>
const GOALS = {
  calories:2300,protein:165,carbs:250,fat:64,fiber:30,sugar:50,
  sodium:2300,potassium:3500,calcium:1000,iron:8,magnesium:420,zinc:11,
  vitA:900,vitC:90,vitD:600,vitB12:2.4,vitB6:1.3,folate:400
};
const COLORS = {
  calories:"#c8f55a",protein:"#4fc3f7",carbs:"#ffb74d",fat:"#f48fb1",
  fiber:"#a5d6a7",sugar:"#ff8a65",sodium:"#ce93d8",potassium:"#80cbc4",
  calcium:"#fff176",iron:"#ef9a9a",magnesium:"#b0bec5",zinc:"#bcaaa4",
  vitA:"#ffa726",vitC:"#66bb6a",vitD:"#42a5f5",vitB12:"#ab47bc",vitB6:"#26c6da",folate:"#d4e157"
};
const MEALS = ["الفطور","الغداء","العشاء","وجبات خفيفة"];
let log = {"الفطور":[],"الغداء":[],"العشاء":[],"وجبات خفيفة":[]};
let currentMeal = "الفطور";
let activeTab = "log";

function switchTab(tab) {
  activeTab = tab;
  document.getElementById('logTab').classList.toggle('hidden', tab !== 'log');
  document.getElementById('analysisTab').classList.toggle('hidden', tab !== 'analysis');
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', (i===0&&tab==='log')||(i===1&&tab==='analysis'));
  });
  if(tab==='analysis') renderAnalysis();
}

function getTotals() {
  const t = {};
  Object.keys(GOALS).forEach(k => t[k] = 0);
  Object.values(log).flat().forEach(item => {
    Object.keys(GOALS).forEach(k => { t[k] += (item[k] || 0); });
  });
  return t;
}

function renderRing(value, goal, color, label, unit, size=68) {
  const p = Math.min(100, Math.round((value/goal)*100));
  const r = (size-10)/2;
  const circ = 2*Math.PI*r;
  const dash = (p/100)*circ;
  return `<div class="ring-wrap">
    <svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#222" stroke-width="6"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="6"
        stroke-dasharray="${dash} ${circ}" stroke-linecap="round"/>
    </svg>
    <div style="margin-top:${-size*0.55}px;text-align:center;position:relative;z-index:1;pointer-events:none">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:${size*0.2}px;color:${color}">${p}%</div>
    </div>
    <div style="margin-top:${size*0.4}px;text-align:center">
      <div class="ring-label">${label}</div>
      <div class="ring-sub">${Math.round(value)}/${goal}${unit}</div>
    </div>
  </div>`;
}

function renderSummary() {
  const t = getTotals();
  document.getElementById('totalCal').textContent = Math.round(t.calories);
  const rem = GOALS.calories - Math.round(t.calories);
  const over = t.calories > GOALS.calories;
  document.getElementById('remainingText').innerHTML = over
    ? `<strong class="over">تجاوزت بـ ${Math.abs(rem)} كالوري</strong>`
    : `متبقي <strong>${rem}</strong> كالوري من ${GOALS.calories}`;
  document.getElementById('ringsContainer').innerHTML =
    renderRing(t.protein,GOALS.protein,COLORS.protein,"بروتين","غ") +
    renderRing(t.carbs,GOALS.carbs,COLORS.carbs,"كارب","غ") +
    renderRing(t.fat,GOALS.fat,COLORS.fat,"دهون","غ") +
    renderRing(t.fiber,GOALS.fiber,COLORS.fiber,"ألياف","غ");
}

function renderMealTabs() {
  document.getElementById('mealTabs').innerHTML = MEALS.map(m =>
    `<button class="meal-tab ${m===currentMeal?'active':''}" onclick="selectMeal('${m}')">${m}</button>`
  ).join('');
}

function selectMeal(m) { currentMeal = m; renderMealTabs(); }

function renderMeals() {
  document.getElementById('mealSections').innerHTML = MEALS.map(m => {
    const cal = Math.round(log[m].reduce((s,i)=>s+(i.calories||0),0));
    const items = log[m].length === 0
      ? `<div class="empty-meal">لا يوجد أكل مضاف</div>`
      : log[m].map(item => `
        <div class="food-item">
          <div style="flex:1">
            <div class="food-name">${item.name}</div>
            <div class="food-macros">
              <span class="food-macro-tag">بروتين ${Math.round(item.protein)}غ</span>
              <span class="food-macro-tag">كارب ${Math.round(item.carbs)}غ</span>
              <span class="food-macro-tag">دهون ${Math.round(item.fat)}غ</span>
            </div>
            <div class="food-grams">${item.grams} غرام</div>
          </div>
          <div class="food-right">
            <button class="del-btn" onclick="removeItem('${m}',${item.id})">✕</button>
            <div class="food-cal-num">${Math.round(item.calories)}</div>
          </div>
        </div>`).join('');
    return `<div class="meal-section">
      <div class="meal-header">
        <div class="meal-name">${m}</div>
        <div class="meal-cal">${cal} كال</div>
      </div>
      ${items}
    </div>`;
  }).join('');
}

function renderBar(label, value, goal, color, unit) {
  const p = Math.min(100, Math.round(((value||0)/goal)*100));
  const over = p >= 100;
  return `<div class="bar-row">
    <div class="bar-top">
      <span class="bar-label">${label}</span>
      <span class="bar-val ${over?'over':''}">${Math.round(value||0)} / ${goal} ${unit}</span>
    </div>
    <div class="bar-track">
      <div class="bar-fill" style="width:${p}%;background:${over?'#ff6b6b':color}"></div>
    </div>
  </div>`;
}

function renderAnalysis() {
  const t = getTotals();
  document.getElementById('macrosBox').innerHTML =
    renderBar("بروتين",t.protein,GOALS.protein,COLORS.protein,"غ")+
    renderBar("كربوهيدرات",t.carbs,GOALS.carbs,COLORS.carbs,"غ")+
    renderBar("دهون",t.fat,GOALS.fat,COLORS.fat,"غ")+
    renderBar("ألياف",t.fiber,GOALS.fiber,COLORS.fiber,"غ")+
    renderBar("سكر",t.sugar,GOALS.sugar,COLORS.sugar,"غ");
  document.getElementById('mineralsBox').innerHTML =
    renderBar("صوديوم",t.sodium,GOALS.sodium,COLORS.sodium,"mg")+
    renderBar("بوتاسيوم",t.potassium,GOALS.potassium,COLORS.potassium,"mg")+
    renderBar("كالسيوم",t.calcium,GOALS.calcium,COLORS.calcium,"mg")+
    renderBar("حديد",t.iron,GOALS.iron,COLORS.iron,"mg")+
    renderBar("ماغنيسيوم",t.magnesium,GOALS.magnesium,COLORS.magnesium,"mg")+
    renderBar("زنك",t.zinc,GOALS.zinc,COLORS.zinc,"mg");
  document.getElementById('vitaminsBox').innerHTML =
    renderBar("فيتامين A",t.vitA,GOALS.vitA,COLORS.vitA,"IU")+
    renderBar("فيتامين C",t.vitC,GOALS.vitC,COLORS.vitC,"mg")+
    renderBar("فيتامين D",t.vitD,GOALS.vitD,COLORS.vitD,"IU")+
    renderBar("فيتامين B12",t.vitB12,GOALS.vitB12,COLORS.vitB12,"mcg")+
    renderBar("فيتامين B6",t.vitB6,GOALS.vitB6,COLORS.vitB6,"mg")+
    renderBar("فولات",t.folate,GOALS.folate,COLORS.folate,"mcg");
}

function removeItem(mealName, id) {
  log[mealName] = log[mealName].filter(i => i.id !== id);
  renderAll();
}

function renderAll() {
  renderSummary();
  renderMealTabs();
  renderMeals();
}

async function addFood() {
  const query = document.getElementById('foodInput').value.trim();
  const grams = document.getElementById('gramsInput').value || "100";
  if (!query) return;
  const btn = document.getElementById('addBtn');
  const err = document.getElementById('errorMsg');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';
  err.classList.add('hidden');
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system: `أنت خبير تغذية دقيق. المستخدم يدخل اسم طعام وعدد الغرامات. أعطه القيم الغذائية التقريبية الدقيقة محسوبة على الكمية المطلوبة.

أجب فقط بـ JSON هكذا (بدون أي نص آخر أو backticks):
{"name":"اسم الطعام","grams":100,"calories":0,"protein":0,"carbs":0,"fat":0,"fiber":0,"sugar":0,"sodium":0,"potassium":0,"calcium":0,"iron":0,"magnesium":0,"zinc":0,"vitA":0,"vitC":0,"vitD":0,"vitB12":0,"vitB6":0,"folate":0}

الوحدات: كالوري, غرام للماكرو, mg للمعادن, IU لفيت A وD, mcg لB12 وفولات, mg لـ C وB6.`,
        messages: [{ role: "user", content: `الطعام: ${query}\nالكمية: ${grams} غرام` }]
      })
    });
    const data = await res.json();
    const text = data.content?.find(b => b.type === "text")?.text || "";
    const parsed = JSON.parse(text.replace(/```json|```/g,"").trim());
    log[currentMeal].push({ ...parsed, id: Date.now() });
    document.getElementById('foodInput').value = "";
    document.getElementById('gramsInput').value = "100";
    renderAll();
  } catch(e) {
    err.textContent = "تعذر تحليل الطعام، حاول مرة ثانية";
    err.classList.remove('hidden');
  }
  btn.disabled = false;
  btn.innerHTML = "تحليل";
}

renderAll();
</script>
</body>
</html>
